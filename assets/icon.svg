<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- 棋盘 -->
  <rect x="80" y="80" width="352" height="352" rx="16" fill="#d4a259"/>
  <g stroke="#8b6914" stroke-width="2" opacity="0.6">
    <!-- 横线 -->
    <line x1="100" y1="140" x2="412" y2="140"/>
    <line x1="100" y1="200" x2="412" y2="200"/>
    <line x1="100" y1="260" x2="412" y2="260"/>
    <line x1="100" y1="320" x2="412" y2="320"/>
    <line x1="100" y1="380" x2="412" y2="380"/>
    <!-- 竖线 -->
    <line x1="140" y1="100" x2="140" y2="412"/>
    <line x1="200" y1="100" x2="200" y2="412"/>
    <line x1="260" y1="100" x2="260" y2="412"/>
    <line x1="320" y1="100" x2="320" y2="412"/>
    <line x1="380" y1="100" x2="380" y2="412"/>
  </g>
  <!-- 星位 -->
  <circle cx="200" cy="200" r="5" fill="#8b6914" opacity="0.6"/>
  <circle cx="260" cy="260" r="5" fill="#8b6914" opacity="0.6"/>
  <!-- 黑子 -->
  <circle cx="170" cy="170" r="22" fill="url(#blackStone)"/>
  <defs>
    <radialGradient id="blackStone" cx="38%" cy="35%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
  </defs>
  <!-- 白子 -->
  <circle cx="290" cy="200" r="22" fill="url(#whiteStone)"/>
  <defs>
    <radialGradient id="whiteStone" cx="38%" cy="35%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#bbb"/>
    </radialGradient>
  </defs>
</svg>
