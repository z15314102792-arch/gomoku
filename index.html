<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>五子棋</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 主菜单 -->
  <div id="menu-screen" class="screen active">
    <div class="menu-container">
      <h1 class="title">五子棋</h1>
      <p class="subtitle">经典策略棋类游戏</p>
      <div class="menu-buttons">
        <button id="btn-local" class="btn btn-primary">
          <span class="btn-icon">👥</span>
          <span>本地双人</span>
        </button>
        <button id="btn-ai-easy" class="btn btn-secondary">
          <span class="btn-icon">🤖</span>
          <span>人机对战 · 简单</span>
        </button>
        <button id="btn-ai-medium" class="btn btn-secondary">
          <span class="btn-icon">🧠</span>
          <span>人机对战 · 中等</span>
        </button>
        <button id="btn-online" class="btn btn-accent">
          <span class="btn-icon">🌐</span>
          <span>联机对战</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 游戏界面 -->
  <div id="game-screen" class="screen">
    <div class="game-header">
      <button id="btn-back" class="btn-back">← 返回</button>
      <div class="status-bar">
        <span id="current-player" class="stone-indicator"></span>
        <span id="status-text"></span>
      </div>
      <button id="btn-restart" class="btn-restart">🔄</button>
    </div>
    <div class="board-wrapper">
      <canvas id="board-canvas"></canvas>
    </div>
  </div>

  <!-- 联机界面 -->
  <div id="online-screen" class="screen">
    <div class="online-header">
      <button id="btn-online-back" class="btn-back">← 返回</button>
      <h2>联机对战</h2>
    </div>
    <div class="online-container">
      <div class="online-section">
        <h3>创建房间</h3>
        <p class="online-desc">创建一个房间，把房间号发给朋友</p>
        <button id="btn-create-room" class="btn btn-primary">创建房间</button>
        <div id="room-info" class="room-info hidden">
          <p>房间号：<strong id="room-id-display"></strong></p>
          <button id="btn-copy-room" class="btn btn-small">📋 复制房间号</button>
          <div id="qr-code" class="qr-code"></div>
          <p class="waiting-text">等待对手加入…</p>
        </div>
      </div>
      <div class="divider">
        <span>或</span>
      </div>
      <div class="online-section">
        <h3>加入房间</h3>
        <p class="online-desc">输入朋友分享的房间号</p>
        <div class="join-form">
          <input type="text" id="input-room-id" placeholder="输入或粘贴房间号" maxlength="40" autocomplete="off">
          <button id="btn-paste-room" class="btn btn-small btn-secondary" title="从剪贴板粘贴">📋</button>
          <button id="btn-join-room" class="btn btn-accent">加入</button>
        </div>
        <p id="join-error" class="error-text hidden"></p>
      </div>
    </div>
  </div>

  <!-- 胜利弹窗 -->
  <div id="win-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="win-text"></h2>
      <div class="modal-buttons">
        <button id="btn-play-again" class="btn btn-primary">再来一局</button>
        <button id="btn-to-menu" class="btn btn-secondary">返回菜单</button>
      </div>
    </div>
  </div>

  <!-- 连接状态提示 -->
  <div id="toast" class="toast hidden"></div>

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- QR 码库 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <!-- 游戏脚本 -->
  <script src="js/board.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/p2p.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
