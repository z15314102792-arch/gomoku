<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>五子棋</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 主菜单 -->
  <div id="menu-screen" class="screen active">
    <div class="menu-container">
      <h1 class="title">五子棋</h1>
      <p class="subtitle">经典策略棋类游戏</p>
      <div class="menu-buttons">
        <button id="btn-local" class="btn btn-primary">
          <span class="btn-icon">👥</span><span>本地双人</span>
        </button>
        <button id="btn-ai-easy" class="btn btn-secondary">
          <span class="btn-icon">🤖</span><span>人机对战 · 简单</span>
        </button>
        <button id="btn-ai-medium" class="btn btn-secondary">
          <span class="btn-icon">🧠</span><span>人机对战 · 中等</span>
        </button>
        <button id="btn-online" class="btn btn-accent">
          <span class="btn-icon">🌐</span><span>联机对战</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 游戏界面 -->
  <div id="game-screen" class="screen">
    <!-- 顶部：双方玩家卡片 + 操作按钮 -->
    <div class="game-header">
      <button id="btn-back" class="btn-icon-only" title="返回">←</button>

      <!-- 黑方卡片 -->
      <div class="player-card" id="black-card">
        <div class="player-avatar black-avatar"></div>
        <div class="player-meta">
          <span class="player-name" id="black-name">黑方</span>
          <span class="player-timer" id="black-timer">0:30</span>
        </div>
      </div>

      <!-- 中间：手数 -->
      <div class="move-badge">
        <span id="move-count">第 1 手</span>
      </div>

      <!-- 白方卡片 -->
      <div class="player-card" id="white-card">
        <div class="player-avatar white-avatar"></div>
        <div class="player-meta">
          <span class="player-name" id="white-name">白方</span>
          <span class="player-timer" id="white-timer">0:30</span>
        </div>
      </div>

      <!-- 右侧操作按钮 -->
      <div class="header-actions">
        <button id="btn-undo" class="btn-icon-only" title="悔棋">↩</button>
        <button id="btn-restart" class="btn-icon-only" title="重新开始">🔄</button>
      </div>
    </div>

    <div class="board-wrapper">
      <canvas id="board-canvas"></canvas>
    </div>

    <!-- 游戏底部提示 -->
    <div class="game-footer">
      <span id="game-hint"></span>
    </div>
  </div>

  <!-- 联机界面 -->
  <div id="online-screen" class="screen">
    <div class="online-header">
      <button id="btn-online-back" class="btn-back">← 返回</button>
      <h2>联机对战</h2>
    </div>
    <div class="online-container">
      <div class="online-section">
        <h3>创建房间</h3>
        <p class="online-desc">创建一个房间，把房间号发给朋友</p>
        <button id="btn-create-room" class="btn btn-primary">创建房间</button>
        <div id="room-info" class="room-info hidden">
          <p>房间号：<strong id="room-id-display"></strong></p>
          <button id="btn-copy-room" class="btn btn-small">📋 复制房间号</button>
          <p class="waiting-text">等待对手加入…</p>
        </div>
      </div>
      <div class="divider"><span>或</span></div>
      <div class="online-section">
        <h3>加入房间</h3>
        <p class="online-desc">输入朋友分享的房间号</p>
        <div class="join-form">
          <input type="text" id="input-room-id" placeholder="输入或粘贴房间号" maxlength="40" autocomplete="off">
          <button id="btn-paste-room" class="btn btn-small btn-secondary" title="从剪贴板粘贴">📋</button>
          <button id="btn-join-room" class="btn btn-accent">加入</button>
        </div>
        <p id="join-error" class="error-text hidden"></p>
      </div>
    </div>
  </div>

  <!-- 胜利弹窗 -->
  <div id="win-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="win-text"></h2>
      <div class="modal-buttons">
        <button id="btn-play-again" class="btn btn-primary">再来一局</button>
        <button id="btn-to-menu" class="btn btn-secondary">返回菜单</button>
      </div>
    </div>
  </div>

  <!-- 请求弹窗（联机悔棋/重来申请） -->
  <div id="request-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="request-text"></h2>
      <div class="modal-buttons">
        <button id="btn-request-accept" class="btn btn-primary">同意</button>
        <button id="btn-request-reject" class="btn btn-secondary">拒绝</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- 游戏脚本 -->
  <script src="js/board.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/p2p.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
